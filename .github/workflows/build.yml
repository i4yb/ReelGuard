name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Unpack and build
        run: |
          unzip -q ReelGuard.zip
          cd ReelGuard
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: ReelGuard APK ${{ github.run_number }}
          files: ReelGuard/app/build/outputs/apk/release/app-release.apk
